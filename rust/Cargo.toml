[workspace]
resolver = "2"
members = ["crates/*", "apps/*/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Mwimwii/open-design-rust"

[workspace.dependencies]
od-core = { path = "crates/od-core" }
od-daemon = { path = "crates/od-daemon" }

anyhow = "1"
axum = "0.8"
base64 = "0.22"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: serde_json's default Map sorts keys, but TypeScript's
# JSON.stringify walks insertion order — the daemon persists and serves
# JSON that must round-trip byte-for-byte against the TS implementation
# (mcp-config env/headers maps, MCP template objects).
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
