[package]
name = "od-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "OpenDesign desktop shell: Tauri v2 app embedding the in-process od-daemon and serving the apps/web static export"

[lib]
name = "od_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
od-core.workspace = true
od-daemon.workspace = true
anyhow.workspace = true
base64.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

reqwest = { version = "0.12", default-features = false, features = ["json"] }
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
url = "2"

# The capture and PDF groups go through the platform webview directly:
# WebKitGTK's snapshot and print operations. wry already links both, so these
# declare the same versions it is built against.
[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = { version = "0.18", features = ["png"] }
gtk = "0.18"
webkit2gtk = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
serde_json.workspace = true
